<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-label="CODE-03"><rect width="900" height="1100" fill="#ffffff"/><g font-family="Arial,'Noto Sans CJK SC','Noto Sans JP','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="900" height="1100" rx="0" fill="#ffffff" stroke="none"/><rect x="0" y="0" width="900" height="20" rx="0" fill="#3564aa" stroke="none"/><text x="62" y="83" font-size="36" fill="#142f50" font-weight="700" >SOURCE CODE INSPECTION</text><text x="65" y="126" font-size="19" fill="#607996" font-weight="400" >Python snippets, inline comments and output blocks</text><line x1="65" y1="158" x2="835" y2="158" stroke="#9cbbdb" stroke-width="3"/><text x="830" y="1092" font-size="15" fill="#92a2b6" font-weight="400" text-anchor="end">CODE-03   ·   SAMPLE</text><text x="65" y="218" font-size="26" fill="#223d62" font-weight="700" >Example: normalized score aggregation</text><rect x="65" y="265" width="770" height="580" rx="12" fill="#19283d" stroke="none"/><rect x="65" y="265" width="770" height="44" rx="11" fill="#29435e" stroke="none"/><text x="92" y="296" font-size="17" fill="#d8eafc" font-weight="700" >metrics.py</text><text x="94" y="348" font-size="17" fill="#d6e4f0" font-weight="400" >from dataclasses import dataclass</text><text x="94" y="374" font-size="17" fill="#d6e4f0" font-weight="400" >import math</text><text x="94" y="400" font-size="17" fill="#d6e4f0" font-weight="400" ></text><text x="94" y="426" font-size="17" fill="#d6e4f0" font-weight="400" >@dataclass</text><text x="94" y="452" font-size="17" fill="#a6c5ff" font-weight="400" >class Metric:</text><text x="94" y="478" font-size="17" fill="#d6e4f0" font-weight="400" >    key: str</text><text x="94" y="504" font-size="17" fill="#d6e4f0" font-weight="400" >    value: float</text><text x="94" y="530" font-size="17" fill="#d6e4f0" font-weight="400" ></text><text x="94" y="556" font-size="17" fill="#a6c5ff" font-weight="400" >def normalize(metrics):</text><text x="94" y="582" font-size="17" fill="#d6e4f0" font-weight="400" >    total = sum(item.value for item in metrics)</text><text x="94" y="608" font-size="17" fill="#d6e4f0" font-weight="400" >    if total &lt;= 0:</text><text x="94" y="634" font-size="17" fill="#d6e4f0" font-weight="400" >        return []</text><text x="94" y="660" font-size="17" fill="#d6e4f0" font-weight="400" >    scores = []</text><text x="94" y="686" font-size="17" fill="#d6e4f0" font-weight="400" >    for item in metrics:</text><text x="94" y="712" font-size="17" fill="#d6e4f0" font-weight="400" >        scores.append(item.value / total)</text><text x="94" y="738" font-size="17" fill="#d6e4f0" font-weight="400" >    return scores</text><text x="94" y="764" font-size="17" fill="#d6e4f0" font-weight="400" ></text><text x="94" y="790" font-size="17" fill="#91a6ba" font-weight="400" ># Example output: [0.25, 0.35, 0.40]</text><text x="65" y="901" font-size="24" fill="#204a77" font-weight="700" >Evaluation notes</text><rect x="65" y="930" width="760" height="7" rx="3" fill="#d6e0ed" stroke="none"/><rect x="65" y="956" width="712" height="7" rx="3" fill="#d6e0ed" stroke="none"/><rect x="65" y="982" width="664" height="7" rx="3" fill="#d6e0ed" stroke="none"/><rect x="65" y="1008" width="616" height="7" rx="3" fill="#d6e0ed" stroke="none"/></g></svg>