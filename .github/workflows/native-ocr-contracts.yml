name: Native OCR output contracts
on:
  pull_request:
    branches: [dev]
    paths:
      - 'hf-spaces/mvai-doctags-webgpu/native-*.js'
      - 'hf-spaces/mvai-doctags-webgpu/index.html'
      - 'hf-spaces/mvai-doctags-webgpu/model-registry.js'
      - 'hf-spaces/mvai-doctags-webgpu/model-download-source.mjs'
      - 'tests/doctags-model-download-source.test.mjs'
      - 'hf-spaces/mvai-doctags-webgpu/adapters/ovisocr3-native/**'
      - 'hf-spaces/mvai-doctags-webgpu/adapters/paddleocr-vl-1.6/**'
      - 'hf-spaces/mvai-doctags-webgpu/tests/native-*'
      - 'scripts/kaggle/test_doctags_model_registry.cjs'
      - 'scripts/kaggle/validate_browser_doctags_pilot.py'
      - 'hf-spaces/mvai-doctags-webgpu/tests/ovisocr3-*'
      - 'hf-spaces/mvai-doctags-webgpu/scripts/**'
      - 'docs/assets/projects/doctags/browser-inference/index.html'
      - 'docs/assets/projects/doctags/browser-inference/model-registry.js'
      - 'docs/assets/projects/doctags/browser-inference/model-download-source.mjs'
      - 'docs/assets/projects/doctags/browser-inference/native-document-output.js'
      - 'docs/assets/projects/doctags/browser-inference/native-result-renderer.js'
      - 'docs/assets/projects/doctags/browser-inference/dev-paddleocr-vl16.html'
      - 'docs/assets/projects/doctags/browser-inference/adapters/paddleocr-vl-1.6/**'
      - 'docs/assets/projects/doctags/browser-inference/dev-ovisocr3.html'
      - 'docs/assets/projects/doctags/browser-inference/adapters/ovisocr3-native/**'
      - '.github/workflows/native-ocr-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage hash-verified PP-DocLayoutV3 worker for native model integration
        shell: bash
        run: |
          set -euo pipefail
          node hf-spaces/mvai-doctags-webgpu/scripts/stage-ppdoclayout-worker.mjs
          node --input-type=module --check < hf-spaces/mvai-doctags-webgpu/vendor/ppdoclayoutv3/inference.worker.js
          mkdir -p docs/assets/projects/doctags/browser-inference/vendor
          cp -a hf-spaces/mvai-doctags-webgpu/vendor/ppdoclayoutv3 docs/assets/projects/doctags/browser-inference/vendor/
          test -s hf-spaces/mvai-doctags-webgpu/vendor/ppdoclayoutv3/worker-base.js
          test -s docs/assets/projects/doctags/browser-inference/vendor/ppdoclayoutv3/inference.worker.js

      - name: Check native JSON, layout and production integration contracts
        run: node --test hf-spaces/mvai-doctags-webgpu/tests/native-document-output.test.cjs hf-spaces/mvai-doctags-webgpu/tests/native-adapters.test.mjs hf-spaces/mvai-doctags-webgpu/tests/ovisocr3-contract.test.mjs hf-spaces/mvai-doctags-webgpu/tests/native-models-integration.test.mjs && node scripts/kaggle/test_doctags_model_registry.cjs
      - name: Check browser adapter and pinned asset staging script syntax
        run: node --check hf-spaces/mvai-doctags-webgpu/adapters/ovisocr3-native/adapter.mjs && node --check hf-spaces/mvai-doctags-webgpu/adapters/paddleocr-vl-1.6/adapter.mjs && node --check hf-spaces/mvai-doctags-webgpu/adapters/paddleocr-vl-1.6/pipeline-contract.mjs && node --check hf-spaces/mvai-doctags-webgpu/scripts/stage-ppdoclayout-worker.mjs && node --check hf-spaces/mvai-doctags-webgpu/native-document-output.js && node --check hf-spaces/mvai-doctags-webgpu/native-result-renderer.js
      - name: Validate experimental model download origins and fallback safety
        run: |
          node --check hf-spaces/mvai-doctags-webgpu/model-download-source.mjs
          node --check docs/assets/projects/doctags/browser-inference/model-download-source.mjs
          node --test tests/doctags-model-download-source.test.mjs
      - name: Check Ovis exporter Python syntax and IO contract
        run: |
          python -m py_compile hf-spaces/mvai-doctags-webgpu/adapters/ovisocr3-native/export_onnx.py hf-spaces/mvai-doctags-webgpu/adapters/ovisocr3-native/validate_bundle.py hf-spaces/mvai-doctags-webgpu/adapters/ovisocr3-native/test_reference.py hf-spaces/mvai-doctags-webgpu/adapters/ovisocr3-native/prepare_upload.py hf-spaces/mvai-doctags-webgpu/adapters/ovisocr3-native/test_export_contract.py
          python hf-spaces/mvai-doctags-webgpu/adapters/ovisocr3-native/test_export_contract.py
      - name: Check Ovis shell workflow syntax
        run: bash -n hf-spaces/mvai-doctags-webgpu/adapters/ovisocr3-native/upload_bundle.sh && bash -n hf-spaces/mvai-doctags-webgpu/adapters/ovisocr3-native/run_conversion.sh
      - name: Verify DEV preview mirrors match the Space source
        run: |
          cmp hf-spaces/mvai-doctags-webgpu/index.html docs/assets/projects/doctags/browser-inference/index.html
          cmp hf-spaces/mvai-doctags-webgpu/model-download-source.mjs docs/assets/projects/doctags/browser-inference/model-download-source.mjs
          cmp hf-spaces/mvai-doctags-webgpu/model-registry.js docs/assets/projects/doctags/browser-inference/model-registry.js
          cmp hf-spaces/mvai-doctags-webgpu/native-document-output.js docs/assets/projects/doctags/browser-inference/native-document-output.js
          cmp hf-spaces/mvai-doctags-webgpu/native-result-renderer.js docs/assets/projects/doctags/browser-inference/native-result-renderer.js
          cmp hf-spaces/mvai-doctags-webgpu/dev-paddleocr-vl16.html docs/assets/projects/doctags/browser-inference/dev-paddleocr-vl16.html
          cmp hf-spaces/mvai-doctags-webgpu/adapters/paddleocr-vl-1.6/adapter.mjs docs/assets/projects/doctags/browser-inference/adapters/paddleocr-vl-1.6/adapter.mjs
          cmp hf-spaces/mvai-doctags-webgpu/adapters/paddleocr-vl-1.6/pipeline-contract.mjs docs/assets/projects/doctags/browser-inference/adapters/paddleocr-vl-1.6/pipeline-contract.mjs
          cmp hf-spaces/mvai-doctags-webgpu/dev-ovisocr3.html docs/assets/projects/doctags/browser-inference/dev-ovisocr3.html
          cmp hf-spaces/mvai-doctags-webgpu/adapters/ovisocr3-native/adapter.mjs docs/assets/projects/doctags/browser-inference/adapters/ovisocr3-native/adapter.mjs
          cmp hf-spaces/mvai-doctags-webgpu/adapters/ovisocr3-native/contract.mjs docs/assets/projects/doctags/browser-inference/adapters/ovisocr3-native/contract.mjs

