name: V1.0.3 archival real sleep-posture pilot
on:
  pull_request:
    branches: [dev]
    paths:
      - scripts/video-action/publish_sleep_pilot.py
      - .github/workflows/video-action-sleep-pilot.yml
permissions: {contents: read}
jobs:
  publish-public-domain-sleep-posture:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install 'huggingface_hub>=0.36,<2'
      - name: Verify matching 8s film clip SHA and atomically upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/video-action/publish_sleep_pilot.py
