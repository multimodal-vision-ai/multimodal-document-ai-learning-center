name: Research Radar collection

on:
  workflow_dispatch:
  schedule:
    - cron: "25 1 * * *"

permissions:
  contents: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-data
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Collect public candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/radar/collect.py
      - name: Synchronize labelled research Issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/radar/sync_tasks.py
      - name: Validate records and tests
        run: |
          python -m unittest discover -s tests/radar -v
          python scripts/radar/render.py
      - name: Commit reviewed data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-radar/data
          if ! git diff --cached --quiet; then
            git commit -m "chore(radar): refresh research snapshots"
            git push origin HEAD:radar-data
          fi
