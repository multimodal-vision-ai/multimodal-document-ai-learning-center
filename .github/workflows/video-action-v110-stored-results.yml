name: V1.0.10 single-model inference with stored-results comparison
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/assets/projects/video-action/browser-inference/**'
      - 'scripts/video-action/test-v110-stored-results.mjs'
      - '.github/workflows/video-action-v110-stored-results.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  stored-results:
    if: github.event_name != 'pull_request' || (github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chrome
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chrome
      - name: Verify real individual inference, stored results, and per-video isolation
        run: |
          node --check docs/assets/projects/video-action/browser-inference/app.js
          node --check scripts/video-action/test-v110-stored-results.mjs
          python3 -m http.server 8765 --directory docs/assets/projects/video-action/browser-inference >/tmp/mvai-v110-http.log 2>&1 &
          node scripts/video-action/test-v110-stored-results.mjs
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvai-v110-single-inference-stored-result-comparison
          path: artifacts/video-action/v110-results-only/
          if-no-files-found: warn
          retention-days: 14
