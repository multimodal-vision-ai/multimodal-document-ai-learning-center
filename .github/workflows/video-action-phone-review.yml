name: V1.0.3 phone-use action segment audit (NO HF upload)
on:
  pull_request:
    branches: [dev]
    paths:
      - scripts/video-action/review_phone_segment.py
      - .github/workflows/video-action-phone-review.yml
permissions: {contents: read}
jobs:
  inspect-phone-segment:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install review tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install 'pillow>=10,<13'
      - name: Decode and inspect phone use interval
        run: python scripts/video-action/review_phone_segment.py
      - name: Preserve review contact sheet and candidate clip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v103-phone-use-segment-review
          path: artifacts/video-action/phone-use-candidate/
          retention-days: 7
          if-no-files-found: warn
