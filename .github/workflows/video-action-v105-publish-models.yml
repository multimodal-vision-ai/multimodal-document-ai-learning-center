name: V1.0.5 publish verified official MoViNet A1/A2 model mirror (isolated)
on:
  pull_request:
    branches: [dev]
    paths:
      - scripts/video-action/publish_official_compare_models.py
      - .github/workflows/video-action-v105-publish-models.yml
permissions: {contents: read}
jobs:
  publish-a1-a2:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install HF Hub
        run: python -m pip install 'huggingface_hub>=0.36,<2'
      - name: Verify official source hashes and publish model-only assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/video-action/publish_official_compare_models.py
