name: Publish DocTags to Hugging Face Static Space

on:
  push:
    branches: [dev]
    paths:
      - "hf-spaces/mvai-doctags-webgpu/**"
      - ".github/workflows/publish-hf-doctags.yml"

permissions:
  contents: read

concurrency:
  group: publish-hf-doctags-dev
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved DEV source
        uses: actions/checkout@v4

      - name: Validate static Space bundle
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md index.html doctags-renderer.js model-registry.js; do
            test -s "hf-spaces/mvai-doctags-webgpu/$file"
          done
          for file in new_arxiv.png image-2.jpg code.jpg lake-zurich-switzerland-view-nature-landscapes-7bbda4-1024.jpg 87664.png 06236926002285.png ar_page_0.png japanse_4_ibm.png zh_page_0.png; do
            test -s "hf-spaces/mvai-doctags-webgpu/samples/$file"
          done
          python scripts/kaggle/validate_browser_doctags_pilot.py

      - name: Check Hugging Face publish permission
        id: hf
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -n "$HF_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Hugging Face publish credential is configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=HF publishing not enabled::Create a Public Static Space multimodal-vision-ai/mvai-doctags-webgpu, add a repository secret named HF_TOKEN, then rerun this workflow. DEV source is already safe; no public HF deployment was attempted."
          fi

      - name: Publish Static Space bundle with nine built-in samples
        if: steps.hf.outputs.enabled == 'true'
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: multimodal-vision-ai/mvai-doctags-webgpu
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
          subdirectory: hf-spaces/mvai-doctags-webgpu

      - name: Verify public HF Space homepage
        if: steps.hf.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://multimodal-vision-ai-mvai-doctags-webgpu.static.hf.space/"
          found=false
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$base" -o /tmp/mvai-hf-docs.html; then
              if grep -q '实时文档结构化解析-DocTags' /tmp/mvai-hf-docs.html &&
                 grep -q 'model-registry.js' /tmp/mvai-hf-docs.html; then
                found=true
                echo "Public Static Space HTML verified on attempt $attempt."
                break
              fi
            fi
            sleep 10
          done
          if [[ "$found" != "true" ]]; then
            echo "::warning title=Public Space not yet verified::HF upload succeeded, but the public hf.space URL did not pass the HTML content probe. Check Space build status and test it manually."
          fi

