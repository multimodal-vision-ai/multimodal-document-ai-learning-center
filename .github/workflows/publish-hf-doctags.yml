name: Publish DocTags to Hugging Face Static Space

on:
  push:
    branches: [dev]
    paths:
      - "hf-spaces/mvai-doctags-webgpu/**"
      - ".github/workflows/publish-hf-doctags.yml"

permissions:
  contents: read

concurrency:
  group: publish-hf-doctags-dev
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved DEV source
        uses: actions/checkout@v4

      - name: Assemble DocTags challenge images
        run: python scripts/kaggle/assemble_doctags_challenge_archive.py --remove-parts

      - name: Stage hash-verified PP-DocLayoutV3 worker for native model integration
        shell: bash
        run: |
          set -euo pipefail
          node hf-spaces/mvai-doctags-webgpu/scripts/stage-ppdoclayout-worker.mjs
          node --input-type=module --check < hf-spaces/mvai-doctags-webgpu/vendor/ppdoclayoutv3/inference.worker.js
          mkdir -p docs/assets/projects/doctags/browser-inference/vendor
          cp -a hf-spaces/mvai-doctags-webgpu/vendor/ppdoclayoutv3 docs/assets/projects/doctags/browser-inference/vendor/
          test -s hf-spaces/mvai-doctags-webgpu/vendor/ppdoclayoutv3/worker-base.js
          test -s docs/assets/projects/doctags/browser-inference/vendor/ppdoclayoutv3/inference.worker.js

      - name: Validate static Space bundle
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md index.html doctags-renderer.js model-registry.js native-document-output.js native-result-renderer.js; do
            test -s "hf-spaces/mvai-doctags-webgpu/$file"
          done
          for file in adapters/ovisocr3-native/adapter.mjs adapters/ovisocr3-native/contract.mjs adapters/ovisocr3-native/README.md adapters/paddleocr-vl-1.6/adapter.mjs adapters/paddleocr-vl-1.6/pipeline-contract.mjs adapters/paddleocr-vl-1.6/progress.mjs vendor/ppdoclayoutv3/worker-base.js vendor/ppdoclayoutv3/inference.worker.js; do
            test -s "hf-spaces/mvai-doctags-webgpu/$file"
          done
          for file in new_arxiv.png image-2.jpg code.jpg lake-zurich-switzerland-view-nature-landscapes-7bbda4-1024.jpg 87664.png 06236926002285.png ar_page_0.png japanse_4_ibm.png zh_page_0.png; do
            test -s "hf-spaces/mvai-doctags-webgpu/samples/$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("hf-spaces/mvai-doctags-webgpu/samples")
          manifest = json.loads((root / "challenges/manifest.json").read_text(encoding="utf-8"))
          assert len(manifest) == 28, "Expected 28 challenge samples"
          for item in manifest:
              path = root / item["file"]
              assert path.is_file() and path.stat().st_size > 1000, f"Missing challenge image: {path}"
              data = path.read_bytes()[:12]
              assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", f"Invalid WebP: {path}"
          print("All 28 challenge samples verified.")
          PY
          python scripts/kaggle/validate_browser_doctags_pilot.py

      - name: Check Hugging Face publish permission
        id: hf
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -n "$HF_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Hugging Face publish credential is configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=HF publishing not enabled::Create a Public Static Space multimodal-vision-ai/mvai-doctags-webgpu, add a repository secret named HF_TOKEN, then rerun this workflow. DEV source is already safe; no public HF deployment was attempted."
          fi

      - name: Publish Static Space bundle with official and challenge samples
        if: steps.hf.outputs.enabled == 'true'
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: multimodal-vision-ai/mvai-doctags-webgpu
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
          subdirectory: hf-spaces/mvai-doctags-webgpu

      - name: Verify public HF Space homepage
        if: steps.hf.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://multimodal-vision-ai-mvai-doctags-webgpu.static.hf.space/"
          found=false
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$base" -o /tmp/mvai-hf-docs.html; then
              if grep -q '实时文档结构化解析-DocTags' /tmp/mvai-hf-docs.html &&
                 grep -q 'model-registry.js' /tmp/mvai-hf-docs.html; then
                found=true
                echo "Public Static Space HTML verified on attempt $attempt."
                break
              fi
            fi
            sleep 10
          done
          if [[ "$found" != "true" ]]; then
            echo "::warning title=Public Space not yet verified::HF upload succeeded, but the public hf.space URL did not pass the HTML content probe. Check Space build status and test it manually."
          fi

          if [[ "$found" == "true" ]]; then
            curl -fsSL --max-time 20 "${base}index.html" -o /tmp/mvai-hf-doctags-index.html
            grep -q "OvisOCR3 0.8B" /tmp/mvai-hf-doctags-index.html
            grep -q "PaddleOCR-VL-1.6 0.9B" /tmp/mvai-hf-doctags-index.html
            curl -fsSL --max-time 20 "${base}model-registry.js" -o /tmp/mvai-hf-model-registry.js
            grep -q "de391cb93aa2ee1b67692bdba1b143bf8e4a9f98" /tmp/mvai-hf-model-registry.js
            grep -q "5219606297d00bbd23b2ec193271af0c0b427dfc" /tmp/mvai-hf-model-registry.js
            for asset in native-document-output.js native-result-renderer.js adapters/ovisocr3-native/adapter.mjs adapters/paddleocr-vl-1.6/adapter.mjs adapters/paddleocr-vl-1.6/progress.mjs vendor/ppdoclayoutv3/inference.worker.js; do
              curl -fsSL --max-time 20 "${base}${asset}" -o "/tmp/$(basename "$asset")"
              test -s "/tmp/$(basename "$asset")"
            done
            echo "Public HF Space integrated native model registry and runtime assets verified."
          fi

