name: Video Action V1.0.3 Browser Probe (DEV only)
on:
  push:
    branches:
      - feat/video-action-v103
  pull_request:
    branches: [dev]
    paths:
      - 'docs/assets/projects/video-action/browser-inference/**'
      - 'scripts/video-action/**'
      - '.github/workflows/video-action-v103-browser-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-probe:
    if: github.event_name != 'pull_request' || (github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install 'pillow>=10,<13'
          python3 scripts/video-action/generate_demo.py
          node --check docs/assets/projects/video-action/browser-inference/app.js
          node --check scripts/video-action/browser-probe.mjs
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npx playwright install chrome
      - name: Launch static server and probe actual Chrome WASM runtime
        run: |
          python3 -m http.server 8765 --directory docs/assets/projects/video-action/browser-inference >/tmp/mvai-http.log 2>&1 &
          node scripts/video-action/browser-probe.mjs
      - name: Save browser report and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-action-v103-browser-probe
          path: artifacts/video-action/
          if-no-files-found: warn
