name: Deploy MkDocs
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Load reviewed radar data
        run: |
          if git ls-remote --exit-code --heads origin radar-data >/dev/null 2>&1; then
            git fetch origin radar-data
            git archive origin/radar-data research-radar/data | tar -xf -
          fi
          python -m unittest discover -s tests/radar -v
          python scripts/radar/screening.py
          python scripts/radar/render.py

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Verify current publication content and four-dimensional gate
        run: python scripts/radar/verify_publication.py --site-dir site --data-dir research-radar/data

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
