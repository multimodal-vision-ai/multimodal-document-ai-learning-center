name: Deploy MkDocs
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Stage approved Our Solution browser assets
        run: python scripts/video-action/stage_our_solution_release.py

      - name: Assemble DocTags challenge images
        run: python scripts/kaggle/assemble_doctags_challenge_archive.py --remove-parts
      - name: Stage hash-verified PP-DocLayoutV3 worker for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          node hf-spaces/mvai-doctags-webgpu/scripts/stage-ppdoclayout-worker.mjs
          node --input-type=module --check < hf-spaces/mvai-doctags-webgpu/vendor/ppdoclayoutv3/inference.worker.js
          mkdir -p docs/assets/projects/doctags/browser-inference/vendor
          cp -a hf-spaces/mvai-doctags-webgpu/vendor/ppdoclayoutv3 docs/assets/projects/doctags/browser-inference/vendor/
          test -s docs/assets/projects/doctags/browser-inference/vendor/ppdoclayoutv3/worker-base.js
          test -s docs/assets/projects/doctags/browser-inference/vendor/ppdoclayoutv3/inference.worker.js

      - name: Load reviewed radar data
        run: |
          if git ls-remote --exit-code --heads origin radar-data >/dev/null 2>&1; then
            git fetch origin radar-data
            git archive origin/radar-data research-radar/data | tar -xf -
          fi
          # Link old completed reviews to their recorded first-stage evidence.
          # This affects only the CI checkout; the radar-data branch stays untouched.
          python scripts/radar/restore_historical_review_provenance.py
          python -m unittest discover -s tests/radar -v
          python scripts/radar/screening.py
          python scripts/radar/render.py

      - name: Install E01/E02 Notebook teaching dependencies
        run: python -m pip install imageio-ffmpeg==0.6.0 nbclient==0.10.2 nbformat==5.10.4 ipykernel matplotlib opencv-python-headless

      - name: Generate approved E01/E02 teaching resources and validate outputs
        run: |
          python scripts/course_labs/stage_resources.py
          python scripts/course_labs/check_student.py

      - name: Generate approved E03 V2.0 resources and validate outputs
        run: |
          python scripts/course_labs/e03/stage_e03_dev.py
          python scripts/course_labs/e03/check_e03.py

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Stage approved E04 V1.0 application and verify genuine student inference
        shell: bash
        env:
          YOLO_AUTOINSTALL: 'False'
          OMP_NUM_THREADS: '2'
          E04_SOURCE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/e04-env"
          P="$RUNNER_TEMP/e04-env/bin/python"
          "$P" -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          "$P" -m pip install ultralytics==8.4.219 onnx onnxruntime playwright==1.65.2 pillow nbclient nbformat ipykernel
          "$P" -m playwright install chromium
          E04="$PWD/site/resources/course-labs/intelligent-perception/e04-app"
          "$P" scripts/course_labs/e04/stage_e04_preview.py "$E04" "$RUNNER_TEMP/e04-stage" "$E04_SOURCE_REF"
          "$P" scripts/course_labs/e04/browser_real_media.py "$E04"
          # Reproduce the downloadable Notebook in its own extracted student directory.
          mkdir -p "$RUNNER_TEMP/e04-student"
          "$P" -m zipfile -e "$E04/downloads/MVAI_E04_V1.0_student.zip" "$RUNNER_TEMP/e04-student"
          "$P" -m ipykernel install --user --name e04-release
          export E04_STUDENT="$RUNNER_TEMP/e04-student"
          "$P" - <<'PY'
          import os, nbformat
          from pathlib import Path
          from nbclient import NotebookClient
          p=Path(os.environ['E04_STUDENT'])
          nb=nbformat.read(p/'E04_YOLO_Object_Detection_V1.0.ipynb',as_version=4)
          NotebookClient(nb,timeout=300,kernel_name='e04-release',resources={'metadata':{'path':str(p)}}).execute()
          print('E04 complete student Notebook CPU execution: PASS')
          PY
          test -s "$E04/e04-media/data/browser-video-validation.json"
          test ! -e "$E04/teacher.html"
          test ! -e "$E04/downloads/E04_teacher_guide.pdf"

      - name: Verify approved student pages in Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
          ln -s "$PWD/site" "$RUNNER_TEMP/dev-site"
          python scripts/course_labs/smoke_browser.py

      - name: Verify current publication content and four-dimensional gate
        run: python scripts/radar/verify_publication.py --site-dir site --data-dir research-radar/data

      # Unique per run and attempt: retries must not encounter two same-name
      # artifacts in one workflow run.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site

      # GitHub Actions artifact metadata may take a few seconds to become
      # visible to deploy-pages after the upload endpoint returns success.
      - name: Wait for artifact metadata
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
