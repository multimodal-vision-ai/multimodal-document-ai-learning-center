name: V1.0.6 selective model comparison real Chrome (DEV)
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/assets/projects/video-action/browser-inference/**'
      - scripts/video-action/test-selectable-comparison.mjs
      - .github/workflows/video-action-v106-selective-compare.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  selectable-compare:
    if: github.event_name != 'pull_request' || (github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install official Chrome and video codecs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npx playwright install chrome
      - name: Inspect source syntax and test 1–3 model selection
        run: |
          node --check docs/assets/projects/video-action/browser-inference/app.js
          node --check scripts/video-action/test-selectable-comparison.mjs
          python3 -m http.server 8765 --directory docs/assets/projects/video-action/browser-inference >/tmp/mvai-select-http.log 2>&1 &
          node scripts/video-action/test-selectable-comparison.mjs
      - name: Preserve real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvai-v106-selective-model-chrome
          path: artifacts/video-action/v106-selective/
          if-no-files-found: warn
          retention-days: 14
