name: V1.0.3 adult eating pilot upload (reviewed frames)
on:
  pull_request:
    branches: [dev]
    paths:
      - scripts/video-action/publish_eating_pilot.py
      - .github/workflows/video-action-eating-pilot.yml
permissions: {contents: read}
jobs:
  publish-real-eating:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install FFmpeg and HF client
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install 'huggingface_hub>=0.36,<2'
      - name: Verify 7s real eating source and publish metadata-atomic pilot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/video-action/publish_eating_pilot.py
