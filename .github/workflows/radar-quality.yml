name: Research Radar quality

on:
  pull_request:
    paths:
      - "research-radar/**"
      - "scripts/radar/**"
      - "tests/radar/**"
      - "docs/radar/**"
      - ".github/workflows/radar-*.yml"
      - ".github/workflows/deploy.yml"
      - "docs/index.md"
      - "mkdocs.yml"
  push:
    branches: [dev]
    paths:
      - "research-radar/**"
      - "scripts/radar/**"
      - "tests/radar/**"
      - "docs/radar/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate research model
        run: python -m unittest discover -s tests/radar -v
      - name: Render empty or approved records
        run: python scripts/radar/render.py
      - name: Require deterministic rendering
        run: |
          sha256sum docs/index.md docs/radar/*.md > /tmp/radar-before.sha
          python scripts/radar/render.py
          sha256sum docs/index.md docs/radar/*.md > /tmp/radar-after.sha
          diff -u /tmp/radar-before.sha /tmp/radar-after.sha
      - name: Build documentation
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict
