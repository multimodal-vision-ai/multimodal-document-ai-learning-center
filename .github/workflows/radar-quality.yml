name: Research Radar quality

on:
  pull_request:
    paths:
      - "research-radar/**"
      - "scripts/radar/**"
      - "tests/radar/**"
      - "docs/radar/**"
      - ".github/workflows/radar-*.yml"
      - ".github/workflows/deploy.yml"
      - "docs/index.md"
      - "mkdocs.yml"
  push:
    branches: [dev]
    paths:
      - "research-radar/**"
      - "scripts/radar/**"
      - "tests/radar/**"
      - "docs/radar/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Research and discovery unit tests (mocked network)
        run: python -m unittest discover -s tests/radar -v
      - name: Inspect daily weekly monthly scheduler health (read-only)
        run: python scripts/radar/health.py
      - name: Render site from reviewed data
        run: python scripts/radar/render.py
      - name: Require deterministic output
        run: |
          sha256sum docs/index.md docs/radar/*.md > /tmp/radar-before.sha
          python scripts/radar/render.py
          sha256sum docs/index.md docs/radar/*.md > /tmp/radar-after.sha
          diff -u /tmp/radar-before.sha /tmp/radar-after.sha
      - name: Build MkDocs strictly
        run: |
          pip install -r requirements-docs.txt
          python -m unittest discover -s tests/radar -p 'test_publication*.py' -v
          mkdocs build --strict
          python scripts/radar/verify_publication.py --site-dir site
