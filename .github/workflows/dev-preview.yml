name: DEV Preview - isolated static build

# No deployment to the repository's official GitHub Pages environment.
# PRs publish to isolated dev-preview-pr-N branches; dev pushes publish the
# shared dev-preview branch. Neither path deploys to the official Pages site.
on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/dev-preview.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/radar/**"
      - "research-radar/**"
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-preview
  cancel-in-progress: false

jobs:
  build:
    name: Build isolated DEV website
    runs-on: ubuntu-latest
    env:
      PREVIEW_BRANCH: ${{ github.event_name == 'pull_request' && format('dev-preview-pr-{0}', github.event.pull_request.number) || 'dev-preview' }}
    permissions:
      contents: read
    steps:
      - name: Checkout code under review
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs dependencies
        run: pip install -r requirements-docs.txt

      - name: Hydrate optional research data (read-only)
        run: |
          if git ls-remote --exit-code --heads origin radar-data > /dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin radar-data
            git archive FETCH_HEAD research-radar/data | tar -xf -
          fi

      - name: Seed persistent Top 3 before the weekly report is refreshed
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[radar-weekly-scan]'))
        run: python scripts/radar/top3.py --bootstrap

      - name: Collect real public candidates (DEV branch only)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[radar-weekly-scan]'))
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/radar/collect.py

      - name: Refresh Issue snapshot and dated reports (DEV only)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[radar-weekly-scan]'))
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/radar/sync_tasks.py
          python scripts/radar/reports.py

      - name: Render Research Radar snapshot
        run: |
          python -m unittest discover -s tests/radar -v
          python scripts/radar/screening.py
          python scripts/radar/health.py
          python scripts/radar/render.py

      - name: Override preview base URL in temporary runner copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("mkdocs.yml")
          text = path.read_text(encoding="utf-8")
          branch = os.environ["PREVIEW_BRANCH"]
          target = (
              "site_url: https://raw.githack.com/"
              "multimodal-vision-ai/multimodal-document-ai-learning-center/"
              f"{branch}/"
          )
          new, count = re.subn(r"(?m)^site_url: .*$", target, text)
          if count != 1:
              raise SystemExit("Could not locate exactly one MkDocs site_url")
          path.write_text(new, encoding="utf-8")
          PY

      - name: Strict build with explicit HTML links
        run: |
          mkdocs build --strict --no-directory-urls --site-dir "$RUNNER_TEMP/dev-site"
          python scripts/radar/verify_publication.py --site-dir "$RUNNER_TEMP/dev-site"

      - name: Add visible DEV environment marking
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "dev-site"
          banner = (
              '<div role="note" style="position:relative;z-index:10;'
              'padding:.4rem 1rem;text-align:center;background:#fef3c7;'
              'color:#713f12;font:600 14px/1.5 system-ui,sans-serif">'
              'DEV 预览版 · 来自 dev 分支 · 非正式发布站点'
              '</div>'
          )
          count = 0
          for path in root.rglob("*.html"):
              body = path.read_text(encoding="utf-8")
              start = body.find("<body")
              if start == -1:
                  continue
              insert = body.find(">", start)
              if insert == -1:
                  continue
              path.write_text(body[:insert+1] + banner + body[insert+1:], encoding="utf-8")
              count += 1
          if not (root / "index.html").exists() or count == 0:
              raise SystemExit("MkDocs preview is missing HTML output")
          print(f"Marked {count} pages as DEV-only")
          PY

      - name: Upload preview for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dev-preview-site
          path: ${{ runner.temp }}/dev-site
          retention-days: 7

      - name: Stage public Radar data for snapshot persistence (DEV only)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[radar-weekly-scan]'))
        run: |
          mkdir -p "$RUNNER_TEMP/radar-snapshot"
          cp -a research-radar/data/. "$RUNNER_TEMP/radar-snapshot/"

      - name: Upload data snapshot artifact (DEV only)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[radar-weekly-scan]'))
        uses: actions/upload-artifact@v4
        with:
          name: dev-radar-snapshot
          path: ${{ runner.temp }}/radar-snapshot
          retention-days: 3

  publish:
    name: Publish isolated DEV preview branch
    needs: build
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'dev' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    env:
      PREVIEW_BRANCH: ${{ github.event_name == 'pull_request' && format('dev-preview-pr-{0}', github.event.pull_request.number) || 'dev-preview' }}
    permissions:
      contents: write
    steps:
      - name: Checkout source for authenticated push
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true

      - name: Download built DEV site
        uses: actions/download-artifact@v4
        with:
          name: dev-preview-site
          path: ${{ runner.temp }}/dev-site

      - name: Publish static files to dev-preview branch only
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/dev-site/index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "refs/heads/$PREVIEW_BRANCH" > /dev/null 2>&1; then
            git fetch --no-tags origin "$PREVIEW_BRANCH"
            git switch -C "$PREVIEW_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$PREVIEW_BRANCH"
          fi
          git rm -rf --ignore-unmatch . > /dev/null
          git clean -fdx > /dev/null
          cp -a "$RUNNER_TEMP/dev-site/." .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "DEV preview is already up to date."
          else
            git commit -m "docs(preview): refresh generated DEV site [skip ci]"
            git push origin "HEAD:refs/heads/$PREVIEW_BRANCH"
          fi
          echo "DEV preview URL: https://raw.githack.com/multimodal-vision-ai/multimodal-document-ai-learning-center/$PREVIEW_BRANCH/index.html"

      - name: Checkout persistent Radar data branch
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[radar-weekly-scan]'))
        uses: actions/checkout@v4
        with:
          ref: radar-data
          path: radar-store
          persist-credentials: true

      - name: Download collected data snapshot
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[radar-weekly-scan]'))
        uses: actions/download-artifact@v4
        with:
          name: dev-radar-snapshot
          path: ${{ runner.temp }}/radar-snapshot

      - name: Persist only generated public data to radar-data
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[radar-weekly-scan]'))
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/radar-snapshot/candidates.json"
          mkdir -p radar-store/research-radar/data
          cp -a "$RUNNER_TEMP/radar-snapshot/." radar-store/research-radar/data/
          cd radar-store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-radar/data/candidates.json research-radar/data/tasks.json
          git add research-radar/data/collection-status.json
          git add research-radar/data/screening-queue.json
          git add research-radar/data/chatgpt-reviewed/top3.json
          for folder in daily weekly monthly; do
            if [ -d "research-radar/data/$folder" ]; then
              git add "research-radar/data/$folder"
            fi
          done
          if git diff --cached --quiet; then
            echo "Radar data snapshot unchanged."
          else
            git commit -m "data(radar): update candidate discovery and DEV reports [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/radar-data; then
                pushed=1
                break
              fi
              echo "::warning::radar-data advanced concurrently; rebasing snapshot (attempt $attempt/3)"
              git fetch origin radar-data
              git rebase FETCH_HEAD
              sleep 3
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::radar-data push did not succeed after retries"
              exit 1
            fi
          fi

      - name: Verify public DEV preview serves rendered HTML and assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githack.com/multimodal-vision-ai/multimodal-document-ai-learning-center/$PREVIEW_BRANCH"
          root_url="$base/index.html?preview_build=${GITHUB_SHA}"
          radar_url="$base/radar/index.html?preview_build=${GITHUB_SHA}"
          for attempt in 1 2 3 4 5 6; do
            echo "Probing rendered DEV preview (attempt $attempt/6)"
            if curl --fail --location --silent --show-error --connect-timeout 15 --max-time 25 -D "$RUNNER_TEMP/dev-home.headers" "$root_url" -o "$RUNNER_TEMP/dev-preview-public.html" \
               && curl --fail --location --silent --show-error --connect-timeout 15 --max-time 25 -D "$RUNNER_TEMP/dev-radar.headers" "$radar_url" -o "$RUNNER_TEMP/dev-preview-radar.html" \
               && grep -Eiq '^content-type:[[:space:]]*text/html([;[:space:]]|$)' "$RUNNER_TEMP/dev-home.headers" \
               && grep -Eiq '^content-type:[[:space:]]*text/html([;[:space:]]|$)' "$RUNNER_TEMP/dev-radar.headers" \
               && grep -q "DEV 预览版" "$RUNNER_TEMP/dev-preview-public.html" \
               && ! grep -q "科研雷达" "$RUNNER_TEMP/dev-preview-public.html" \
               && grep -q "前沿动态" "$RUNNER_TEMP/dev-preview-radar.html" \
               && grep -q "重点推荐" "$RUNNER_TEMP/dev-preview-radar.html" \
               && grep -q "展开查看近期自动发现候选" "$RUNNER_TEMP/dev-preview-radar.html"; then
              asset_url="$(python - "$radar_url" "$RUNNER_TEMP/dev-preview-radar.html" <<'PY'
          import re
          import sys
          from urllib.parse import urljoin
          base_url, file_path = sys.argv[1], sys.argv[2]
          body = open(file_path, encoding="utf-8").read()
          match = re.search(r'''href=["']([^"']+\.css[^"']*)["']''', body)
          if not match:
              raise SystemExit("No stylesheet URL found in Radar page")
          print(urljoin(base_url, match.group(1)))
          PY
          )"
              if curl --fail --location --silent --show-error --connect-timeout 15 --max-time 25 "$asset_url" -o "$RUNNER_TEMP/dev-preview-radar.css" \
                 && test -s "$RUNNER_TEMP/dev-preview-radar.css"; then
                echo "DEV preview returns HTML content types and its stylesheet is accessible"
                echo "Open: https://raw.githack.com/multimodal-vision-ai/multimodal-document-ai-learning-center/dev-preview/index.html"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::DEV preview failed the HTML content-type, expected content, or asset check"
          for diagnostic in "$RUNNER_TEMP/dev-home.headers" "$RUNNER_TEMP/dev-radar.headers"; do
            if [ -f "$diagnostic" ]; then
              echo "--- $diagnostic ---"
              grep -iE '^(HTTP/|content-type:|location:)' "$diagnostic" || true
            fi
          done
          if [ -f "$RUNNER_TEMP/dev-preview-public.html" ]; then
            echo "--- welcome page markers ---"
            for marker in "DEV 预览版" "前沿动态" "进入前沿动态" "科研雷达"; do
              if grep -q "$marker" "$RUNNER_TEMP/dev-preview-public.html"; then echo "FOUND: $marker"; else echo "MISSING: $marker"; fi
            done
          fi
          if [ -f "$RUNNER_TEMP/dev-preview-radar.html" ]; then
            echo "--- Radar page markers ---"
            for marker in "前沿动态" "重点推荐" "展开查看近期自动发现候选"; do
              if grep -q "$marker" "$RUNNER_TEMP/dev-preview-radar.html"; then echo "FOUND: $marker"; else echo "MISSING: $marker"; fi
            done
          fi
          echo "The preview is not considered healthy until the browser receives rendered HTML and its stylesheet."
          exit 1

      - name: Verify both model demo pages are publicly reachable
        shell: bash
        run: |
          set -euo pipefail
          # raw.githack may cache branch paths; query strings do not invalidate it.
          # Verify this exact published build using the immutable dev-preview commit.
          preview_sha="$(git rev-parse HEAD)"
          echo "Verifying published model demo snapshot: $preview_sha"
          base="https://raw.githack.com/multimodal-vision-ai/multimodal-document-ai-learning-center/$preview_sha"
          for direction in document video; do
            page="$base/model-demos/$direction.html?preview_build=${GITHUB_SHA}"
            success=0
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --location --silent --show-error --connect-timeout 15 --max-time 30 -D "$RUNNER_TEMP/demo-$direction.headers" "$page" -o "$RUNNER_TEMP/demo-$direction.html" \
                && grep -Eiq '^content-type:[[:space:]]*text/html([;[:space:]]|$)' "$RUNNER_TEMP/demo-$direction.headers" \
                && grep -q "mpg-workspace" "$RUNNER_TEMP/demo-$direction.html" \
                && grep -q "模型演示" "$RUNNER_TEMP/demo-$direction.html" \
                && grep -q "model-demo-sidebar-native-v2.css" "$RUNNER_TEMP/demo-$direction.html" \
                && grep -q "model-playground-guide-v2.css" "$RUNNER_TEMP/demo-$direction.html" \
                && grep -q "model-playground-quota-v1.css" "$RUNNER_TEMP/demo-$direction.html" \
                && grep -q 'class="mpg-help vis-quota-help"' "$RUNNER_TEMP/demo-$direction.html" \
                && grep -q "ZeroGPU quota exceeded" "$RUNNER_TEMP/demo-$direction.html" \
                && ! grep -q '<details class="mpg-help vis-quota-help" open' "$RUNNER_TEMP/demo-$direction.html" \
                && grep -q '<details class="mpg-help">' "$RUNNER_TEMP/demo-$direction.html" \
                && grep -q 'class="mpg-help-caret"' "$RUNNER_TEMP/demo-$direction.html" \
                && ! grep -q 'href="../stylesheets/model-playground-guide-v1.css"' "$RUNNER_TEMP/demo-$direction.html" \
                && ! grep -q '<details class="mpg-help" open' "$RUNNER_TEMP/demo-$direction.html" \
                && ! grep -q 'href="../stylesheets/model-demo-nav.css"' "$RUNNER_TEMP/demo-$direction.html"; then
                if [ "$direction" = "document" ]; then
                  grep -q 'data-mpg-kind="doc"' "$RUNNER_TEMP/demo-$direction.html"
                  ! grep -q 'data-mpg-kind="video"' "$RUNNER_TEMP/demo-$direction.html"
                else
                  grep -q 'data-mpg-kind="video"' "$RUNNER_TEMP/demo-$direction.html"
                  ! grep -q 'data-mpg-kind="doc"' "$RUNNER_TEMP/demo-$direction.html"
                fi
                success=1
                break
              fi
              sleep 12
            done
            if [ "$success" -ne 1 ]; then
              echo "::error::DEV $direction model demo page unavailable or wrong content at pinned preview SHA $preview_sha"
              echo "Response headers:"
              sed -n '1,24p' "$RUNNER_TEMP/demo-$direction.headers" 2>/dev/null || true
              echo "Relevant HTML markers:"
              grep -Eo 'model-playground-quota-v1.css|ZeroGPU quota exceeded|mpg-help vis-quota-help' "$RUNNER_TEMP/demo-$direction.html" 2>/dev/null | sort -u || true
              exit 1
            fi
          done
          for asset in stylesheets/model-playground.css stylesheets/model-playground-guide-v2.css stylesheets/model-playground-quota-v1.css stylesheets/model-demo-sidebar-native-v2.css js/model-playground.js; do
            curl --fail --location --silent --show-error --connect-timeout 15 --max-time 30 "$base/$asset?preview_build=${GITHUB_SHA}" -o "$RUNNER_TEMP/$(basename "$asset")"
            test -s "$RUNNER_TEMP/$(basename "$asset")"
          done
          echo "Both independent DEV demo pages and required CSS/JS assets verified."

      - name: Verify new vision model demo is publicly reachable
        shell: bash
        run: |
          set -euo pipefail
          # raw.githack may cache branch paths; query strings do not invalidate it.
          # Verify this exact published build using the immutable dev-preview commit.
          preview_sha="$(git rev-parse HEAD)"
          echo "Verifying published model demo snapshot: $preview_sha"
          base="https://raw.githack.com/multimodal-vision-ai/multimodal-document-ai-learning-center/$preview_sha"
          page="$base/model-demos/vision.html?preview_build=${GITHUB_SHA}"
          success=0
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error --connect-timeout 15 --max-time 30 \
                -D "$RUNNER_TEMP/vision-demo.headers" "$page" -o "$RUNNER_TEMP/vision-demo.html" \
              && grep -Eiq '^content-type:[[:space:]]*text/html([;[:space:]]|$)' "$RUNNER_TEMP/vision-demo.headers" \
              && grep -q 'data-vis-workspace' "$RUNNER_TEMP/vision-demo.html" \
              && grep -q '<details class="mpg-help">' "$RUNNER_TEMP/vision-demo.html" \
              && grep -q 'model-playground-guide-v2.css' "$RUNNER_TEMP/vision-demo.html" \
              && grep -q 'vision-demo-v3.css' "$RUNNER_TEMP/vision-demo.html" \
              && grep -q 'model-playground-quota-v1.css' "$RUNNER_TEMP/vision-demo.html" \
              && grep -q 'vis-quota-help' "$RUNNER_TEMP/vision-demo.html" \
              && grep -q 'ZeroGPU quota exceeded' "$RUNNER_TEMP/vision-demo.html" \
              && ! grep -q 'href="../stylesheets/vision-demo-v2.css"' "$RUNNER_TEMP/vision-demo.html" \
              && grep -q 'vision-demo-v1.js' "$RUNNER_TEMP/vision-demo.html" \
              && grep -q '视觉感知' "$RUNNER_TEMP/vision-demo.html" \
              && grep -q '文档理解' "$RUNNER_TEMP/vision-demo.html" \
              && grep -q '视频理解' "$RUNNER_TEMP/vision-demo.html"; then
              success=1
              break
            fi
            sleep 12
          done
          if [ "$success" -ne 1 ]; then
            echo "::error::Vision demo page is absent, stale, or missing required navigation/assets at pinned preview SHA $preview_sha"
            sed -n '1,24p' "$RUNNER_TEMP/vision-demo.headers" 2>/dev/null || true
            exit 1
          fi
          for asset in stylesheets/vision-demo-v3.css stylesheets/model-playground-quota-v1.css js/vision-demo-v1.js; do
            curl --fail --location --silent --show-error --connect-timeout 15 --max-time 30 \
              "$base/$asset?preview_build=${GITHUB_SHA}" -o "$RUNNER_TEMP/$(basename "$asset")"
            test -s "$RUNNER_TEMP/$(basename "$asset")"
          done
          for model in ultralytics-yolo26.hf.space ustc-community-d-fine-object-detection.hf.space yonigozlan-segment-anything-2-video-tracking.hf.space; do
            grep -q "$model" "$RUNNER_TEMP/vision-demo-v1.js"
          done
          echo "Vision AI DEV page and all three model configurations verified."
