name: V1.0.9 resilient multi-model inference and download safeguards
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/assets/projects/video-action/browser-inference/**'
      - 'scripts/video-action/test-v109-*.mjs'
      - '.github/workflows/video-action-v109-resilience.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  resilient-compare:
    if: github.event_name != 'pull_request' || (github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check syntax and bounded VideoMAE download unit tests
        run: |
          node --check docs/assets/projects/video-action/browser-inference/app.js
          node --check docs/assets/projects/video-action/browser-inference/video-mae.js
          node --check scripts/video-action/test-v109-videomae-download.mjs
          node --check scripts/video-action/test-v109-resilient-comparison.mjs
          node scripts/video-action/test-v109-videomae-download.mjs
      - name: Install Chrome
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chrome
      - name: Browser A2 + failed Qualcomm download + real MobileCLIP fallback
        run: |
          python3 -m http.server 8765 --directory docs/assets/projects/video-action/browser-inference >/tmp/mvai-v109-http.log 2>&1 &
          node scripts/video-action/test-v109-resilient-comparison.mjs
      - name: Save real inference and failure isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvai-v109-resilient-compare
          path: artifacts/video-action/v109-resilient-comparison/
          if-no-files-found: warn
          retention-days: 14
