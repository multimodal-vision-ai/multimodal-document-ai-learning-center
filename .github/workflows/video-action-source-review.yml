name: V1.0.3 real-source visual review (no uploads)
on:
  pull_request:
    branches: [dev]
    paths: [scripts/video-action/review_real_sources.py, .github/workflows/video-action-source-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    if: github.event_name != 'pull_request' || (github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install review dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install 'pillow>=10,<13'
      - name: Extract bounded candidate source frames for review
        run: python scripts/video-action/review_real_sources.py
      - name: Upload contact sheets and source manifest only (never source videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-action-v103-real-source-review
          path: artifacts/video-action/source-review/
          retention-days: 7
          if-no-files-found: warn
