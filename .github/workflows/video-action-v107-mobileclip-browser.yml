name: V1.0.7 MobileCLIP actual Chrome WebGPU/WASM browser verification
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/assets/projects/video-action/browser-inference/**'
      - 'scripts/video-action/test-mobileclip-real-browser.mjs'
      - '.github/workflows/video-action-v107-mobileclip-browser.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mobileclip-real-browser:
    if: github.event_name != 'pull_request' || (github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install official Chrome and browser harness
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npx playwright install chrome
      - name: Verify source syntax
        run: |
          node --check docs/assets/projects/video-action/browser-inference/app.js
          node --check docs/assets/projects/video-action/browser-inference/mobileclip.js
          node --check scripts/video-action/test-mobileclip-real-browser.mjs
      - name: Real MobileCLIP 6-frame model inference and selectable comparison
        run: |
          python3 -m http.server 8765 --directory docs/assets/projects/video-action/browser-inference >/tmp/mvai-mobileclip-http.log 2>&1 &
          node scripts/video-action/test-mobileclip-real-browser.mjs
      - name: Preserve real model evidence and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvai-v107-mobileclip-browser-results
          path: artifacts/video-action/v107-mobileclip/
          if-no-files-found: warn
          retention-days: 14
