name: V1.0.3 CC-BY corded phone-call pilot
on:
  pull_request:
    branches: [dev]
    paths:
      - scripts/video-action/publish_landline_pilot.py
      - .github/workflows/video-action-landline-pilot.yml
permissions: {contents: read}
jobs:
  publish-licensed-landline:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install FFmpeg and HF client
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install 'huggingface_hub>=0.36,<2'
      - name: Publish audited landline call via atomic HF commit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/video-action/publish_landline_pilot.py
