name: V1.0.5 actual Chrome A0 A1 A2 video comparison (isolated DEV)
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/assets/projects/video-action/browser-inference/**'
      - scripts/video-action/compare-models-browser-probe.mjs
      - .github/workflows/video-action-v105-real-compare.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-real-multimodel:
    if: github.event_name != 'pull_request' || (github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install real Chrome, Playwright, and video codec
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npx playwright install chrome
      - name: Validate all source modules before browser
        run: |
          node --check docs/assets/projects/video-action/browser-inference/app.js
          node --check docs/assets/projects/video-action/browser-inference/official-movinet.js
          node --check scripts/video-action/compare-models-browser-probe.mjs
      - name: Perform real HF A1/A2 streaming inference and full three-model comparison
        run: |
          python3 -m http.server 8765 --directory docs/assets/projects/video-action/browser-inference >/tmp/mvai-v105-server.log 2>&1 &
          node scripts/video-action/compare-models-browser-probe.mjs
      - name: Preserve complete result JSON and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvai-v105-three-real-models-browser-qa
          path: artifacts/video-action/v105-compare
          if-no-files-found: warn
          retention-days: 14
