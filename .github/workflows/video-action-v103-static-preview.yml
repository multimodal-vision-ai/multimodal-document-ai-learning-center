name: V1.0.3 independent HF Static DEV preview
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/assets/projects/video-action/browser-inference/**'
      - 'scripts/video-action/publish_dev_space.py'
      - '.github/workflows/video-action-v103-static-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-isolated-hf-static-dev:
    if: github.event_name != 'pull_request' || (github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install trusted HF Hub client
        run: python -m pip install 'huggingface_hub>=0.36,<2'
      - name: Publish isolated DEV Space using server-side credentials only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/video-action/publish_dev_space.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chrome for live DEV browser verification
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chrome
      - name: Verify six samples and control placement on published HF Space
        env:
          MVAI_BASE_URL: https://multimodal-vision-ai-mvai-video-action-v103-dev.static.hf.space/
        run: node scripts/video-action/test-v108-ui-dataset.mjs
      - name: Save live DEV screenshot and catalog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvai-v108-published-hf-space-browser
          path: artifacts/video-action/v108-ui-catalog/
          if-no-files-found: warn
          retention-days: 14
