name: Documentation quality

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "docs/**"
      - "hf-spaces/mvai-doctags-webgpu/**"
      - "scripts/kaggle/*doctags*"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs-quality.yml"
      - ".github/workflows/deploy.yml"
      - "scripts/video-action/stage_our_solution_release.py"
      - "scripts/video-action/our_solution_release.json"
      - "scripts/radar/restore_historical_review_provenance.py"
      - "tests/radar/test_restore_historical_review_provenance.py"
      - ".github/workflows/native-ocr-contracts.yml"
      - ".github/workflows/publish-hf-doctags.yml"
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt
      - name: Stage approved Our Solution browser assets
        run: python scripts/video-action/stage_our_solution_release.py
      - name: Assemble DocTags challenge images
        run: python scripts/kaggle/assemble_doctags_challenge_archive.py --remove-parts
      - name: Stage hash-verified PP-DocLayoutV3 worker for browser inference validation
        shell: bash
        run: |
          set -euo pipefail
          node hf-spaces/mvai-doctags-webgpu/scripts/stage-ppdoclayout-worker.mjs
          mkdir -p docs/assets/projects/doctags/browser-inference/vendor
          cp -a hf-spaces/mvai-doctags-webgpu/vendor/ppdoclayoutv3 docs/assets/projects/doctags/browser-inference/vendor/
      - name: Validate Kaggle pilot notebook syntax and student links
        run: python scripts/kaggle/validate_doctags_pilot.py
      - name: Validate browser inference JavaScript and HF Space package
        run: python scripts/kaggle/validate_browser_doctags_pilot.py
      - name: Validate archived review provenance fail-closed tests
        run: python -m unittest discover -s tests/radar -p test_restore_historical_review_provenance.py -v
      - name: Validate navigation and internal links
        run: mkdocs build --strict
      - name: Simulate production Pages radar snapshot validation
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin radar-data >/dev/null 2>&1; then
            git fetch origin radar-data
            git archive origin/radar-data research-radar/data | tar -xf -
          fi
          python scripts/radar/restore_historical_review_provenance.py
          python scripts/radar/screening.py
          python scripts/radar/render.py
          mkdocs build --strict
          python scripts/radar/verify_publication.py --site-dir site --data-dir research-radar/data


  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,204,206,429
            --retry-wait-time 2
            --max-retries 2
            --exclude "^https://www[.]acm[.]org/publications/policies/artifact-review-and-badging-current$"
            --exclude "^https://www[.]sciencedirect[.]com/science/article/pii/S1566253525006955$"
            "docs/**/*.md"
          fail: true
