<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E03 浏览器交互实验</title>
<style>
:root{--ink:#213852;--muted:#687b92;--line:#dde6ef;--blue:#4067db}*{box-sizing:border-box}body{background:#f7f9fc;color:var(--ink);margin:0;font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1060px;margin:auto;padding:15px}.tabs{display:flex;flex-wrap:wrap;gap:7px}.tabs button,.scene button{padding:8px 13px;background:#fff;border:1px solid #d6e0ed;border-radius:8px;color:#45607d;cursor:pointer;font-weight:650}.tabs button[aria-selected=true],.scene button.active{background:#eaf0ff;color:#244cc1;border-color:#6f8de0}.grid{display:grid;grid-template-columns:260px 1fr;gap:12px;margin:15px 0}.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:16px}h2{font-size:18px;margin:0 0 8px}p{margin:8px 0}.muted{color:var(--muted);font-size:12px}label{display:block;font-size:12px;font-weight:650;margin:12px 0}select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:white}input[type=range]{width:100%}label .value{float:right;color:#3662c3}.pictures{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pictures figure{margin:0}.pictures canvas{width:100%;height:auto;background:#f1f4f7;border-radius:7px}.pictures figcaption{color:#506986;text-align:center;font-size:12px;font-weight:650}.messages{color:#58708b;border-top:1px solid var(--line);margin-top:14px;padding-top:8px}.video{width:100%;background:#162337;display:block}.scene{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}#chart{border:1px solid var(--line);border-radius:7px;cursor:crosshair;max-height:160px;width:100%}#images[hidden],#timing[hidden]{display:none!important}body.embed header{display:none}header{padding:12px 18px;background:white}header a{color:#3b5fc4;text-decoration:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.pictures{grid-template-columns:1fr}.panel{padding:12px}}
</style></head><body><header><a href="../e03-notebook.html">返回 E03 Notebook</a></header><main><nav class="tabs" aria-label="四项探索"><button data-exp="warp" aria-selected="true">01 透视与鸟瞰</button><button data-exp="curve" aria-selected="false">02 曲线拟合</button><button data-exp="light" aria-selected="false">03 光照与标线</button><button data-exp="time" aria-selected="false">04 连续视频</button></nav><div class="grid"><aside class="panel"><h2 id="exp-title">01 · 透视与鸟瞰</h2><p id="question" class="muted">控制点为什么会改变鸟瞰结果？</p><div id="scene-picker"><label>真实素材<select id="scene"><option value="01_solidWhiteRight_straight_white.jpg">直道</option><option value="03_project_curve_intro.jpg">普通弯道</option><option value="07_harder_curve_motorcycle.jpg">复杂弯道</option><option value="08_harder_shadow_glare.jpg">强光/阴影</option><option value="09_harder_curve_shadow.jpg">树影弯道</option></select></label></div><div id="controls"></div><p class="messages" id="status" aria-live="polite">准备加载真实道路图片…</p><p class="muted">本页面采用 JavaScript/Canvas 教学实现，演示数学思想，与 Python OpenCV 不保证逐像素一致。无 Ground Truth，勿把像素数当准确率。</p></aside><section class="panel"><div id="images" class="pictures"><figure><canvas id="original" width="480" height="270"></canvas><figcaption id="original-title">原始道路图</figcaption></figure><figure><canvas id="a" width="480" height="270"></canvas><figcaption id="a-title">中间结果 A</figcaption></figure><figure><canvas id="b" width="480" height="270"></canvas><figcaption id="b-title">中间结果 B</figcaption></figure><figure><canvas id="c" width="480" height="270"></canvas><figcaption id="c-title">输出</figcaption></figure></div><div id="timing" hidden><p class="muted">视频为已使用 Python/OpenCV 在相同源帧实际处理生成的固定 α=0.6 同步对比。下方 α 滑块只对已记录的轨迹进行二次平滑演示，不会修改视频像素或重新运行 Python。</p><div class="scene"><button data-clip="straight" class="active">直道</button><button data-clip="curve">普通弯道</button><button data-clip="complex">复杂弯道</button></div><video class="video" id="video" controls playsinline preload="metadata" src="../downloads/E03_straight_compare.mp4"></video><p class="muted" id="video-note"></p><canvas width="900" height="175" id="chart" title="点击曲线定位视频时间"></canvas><p class="muted">图中轨迹是未标定像素坐标；平滑仅演示波动与延迟，并非检测准确率。</p></div></section></div></main>
<script>
const P=new URLSearchParams(location.search);if(P.get('embed')==='1')document.body.classList.add('embed');
const W=480,H=270;
const specs={warp:{name:'01 · 透视与鸟瞰',question:'透视梯形顶部位置改变，哪一部分的道路会被裁剪？',scene:'03_project_curve_intro.jpg',params:[['顶边高度 (%)',45,70,1,61],['顶边宽度 (%)',13,35,1,23]]},curve:{name:'02 · 曲线拟合',question:'滑动窗口更宽，候选像素增加是否意味着检测更正确？',scene:'03_project_curve_intro.jpg',params:[['窗口数量',5,13,1,9],['窗口半宽 (px)',18,85,1,48],['白线亮度下限',150,245,5,190]]},light:{name:'03 · 光照与标线',question:'降低白线阈值可以找回阴影中的标线，但会产生什么新问题？',scene:'08_harder_shadow_glare.jpg',params:[['白线亮度下限',120,245,5,190],['黄线饱和度下限',35,180,5,90]]},time:{name:'04 · 连续视频',question:'较强平滑为什么可能使转弯响应滞后？',params:[['轨迹二次平滑 α',10,100,5,60]]}};
let exp='warp',img=null,params=[],clip='straight',series=null;const el=id=>document.getElementById(id);
function value(id){return Number(document.getElementById('p'+id)?.value||0)}
function rgbImage(canvas,source){let ctx=canvas.getContext('2d');ctx.clearRect(0,0,W,H);ctx.drawImage(source,0,0,W,H);return ctx.getImageData(0,0,W,H)}
function paint(id,data){let c=el(id);c.getContext('2d').putImageData(data,0,0)}
function rgbaFromMask(mask){let out=new ImageData(W,H);for(let i=0;i<mask.length;i++){let j=i*4;out.data[j]=out.data[j+1]=out.data[j+2]=mask[i];out.data[j+3]=255}return out}
function newImageData(){let o=new ImageData(W,H);for(let i=3;i<o.data.length;i+=4)o.data[i]=255;return o}
function computeMask(image,lmin=190,smin=90){let raw=image.data,white=new Uint8Array(W*H),yellow=new Uint8Array(W*H),combined=new Uint8Array(W*H);
for(let i=0;i<W*H;i++){let a=i*4,r=raw[a],g=raw[a+1],b=raw[a+2],light=Math.round((Math.max(r,g,b)+Math.min(r,g,b))/2);let yellowish=r>g*.99&&g>b*1.20&&r>b*1.55&&g>65;let brightness=light>=lmin&&Math.max(r,g,b)-Math.min(r,g,b)<100;white[i]=brightness?255:0;yellow[i]=yellowish&&r-g<160&&r-b>=smin?255:0;combined[i]=(brightness||yellow[i])?255:0}
return [white,yellow,combined]}
function solve(A,b){let n=b.length;for(let k=0;k<n;k++){let pivot=k;for(let i=k+1;i<n;i++)if(Math.abs(A[i][k])>Math.abs(A[pivot][k]))pivot=i;if(Math.abs(A[pivot][k])<1e-8)return null;[A[k],A[pivot]]=[A[pivot],A[k]];[b[k],b[pivot]]=[b[pivot],b[k]];let q=A[k][k];for(let j=k;j<n;j++)A[k][j]/=q;b[k]/=q;for(let i=0;i<n;i++)if(i!==k){let t=A[i][k];for(let j=k;j<n;j++)A[i][j]-=t*A[k][j];b[i]-=t*b[k]}}return b}
function homography(src,dst){let A=[],b=[];for(let i=0;i<4;i++){let [x,y]=src[i],[X,Y]=dst[i];A.push([x,y,1,0,0,0,-x*X,-y*X]);b.push(X);A.push([0,0,0,x,y,1,-x*Y,-y*Y]);b.push(Y)}let h=solve(A,b);return h&&[...h,1]}
function perspective(source,top,width){let y0=top/100*H,x1=W*(.5-width/200),x2=W*(.5+width/200);let src=[[x1,y0],[x2,y0],[W*.96,H*.98],[W*.05,H*.98]],dst=[[W*.24,0],[W*.76,0],[W*.76,H-1],[W*.24,H-1]],inv=homography(dst,src);let result=newImageData();if(inv)for(let y=0;y<H;y++)for(let x=0;x<W;x++){let d=inv[6]*x+inv[7]*y+1,sx=Math.round((inv[0]*x+inv[1]*y+inv[2])/d),sy=Math.round((inv[3]*x+inv[4]*y+inv[5])/d);if(sx>=0&&sx<W&&sy>=0&&sy<H){let p=4*(sy*W+sx),z=4*(y*W+x);result.data.set(source.data.slice(p,p+3),z)}}return {result,src}}
function quadratic(pts){if(pts.length<7)return null;let A=[[0,0,0],[0,0,0],[0,0,0]],b=[0,0,0];for(let [x,y] of pts){let t=y/H,v=[t*t,t,1];for(let i=0;i<3;i++){b[i]+=v[i]*x;for(let j=0;j<3;j++)A[i][j]+=v[i]*v[j]}}return solve(A,b)}
function calc(){if(exp==='time'){renderChart();return}if(!img)return;const orig=rgbImage(el('original'),img);let a=orig,b=orig,c=orig,info='';let title=['原始道路','中间结果 A','中间结果 B','最终结果'];
if(exp==='warp'){let x=perspective(orig,value(0),value(1));let ctx=el('a').getContext('2d');paint('a',orig);ctx.strokeStyle='#ff6b36';ctx.lineWidth=4;ctx.beginPath();x.src.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.stroke();paint('b',x.result);paint('c',x.result);title=['原始道路','透视四边形','近似鸟瞰图','对照鸟瞰图'];info='只改变一个控制参数；这不是经过相机标定的米制鸟瞰图';}
else if(exp==='light'){let masks=computeMask(orig,value(0),value(1));paint('a',rgbaFromMask(masks[0]));paint('b',rgbaFromMask(masks[1]));paint('c',rgbaFromMask(masks[2]));title=['真实道路','白线亮度候选','黄色标线候选','组合二值掩膜'];info='白线像素 '+masks[0].filter(Boolean).length+'；黄线像素 '+masks[1].filter(Boolean).length+'（均不是准确率）';}
else if(exp==='curve'){let mask=computeMask(orig,value(2),90)[2];for(let y=0;y<H*.52;y++)for(let x=0;x<W;x++)mask[y*W+x]=0;paint('a',rgbaFromMask(mask));let nw=value(0),margin=value(1),pts=[[],[]],centers=[Math.floor(W*.27),Math.floor(W*.75)];let out=orig;paint('b',out);let ctx=el('b').getContext('2d');let step=Math.ceil(H*.48/nw);ctx.lineWidth=2;
for(let k=0;k<nw;k++){let y1=H-k*step,y0=Math.max(Math.floor(H*.52),y1-step);for(let side=0;side<2;side++){let xx=centers[side],pixels=[];for(let y=y0;y<y1;y+=2)for(let x=Math.max(0,xx-margin);x<Math.min(W,xx+margin);x+=2)if(mask[y*W+x])pixels.push([x,y]);pts[side].push(...pixels);ctx.strokeStyle=side?'#1b9dda':'#ef8c21';ctx.strokeRect(xx-margin,y0,2*margin,y1-y0);if(pixels.length>12)centers[side]=Math.round(pixels.reduce((z,p)=>z+p[0],0)/pixels.length)}}
paint('c',orig);let cc=el('c').getContext('2d');cc.lineWidth=4;let valid=0;for(let side=0;side<2;side++){let coeff=quadratic(pts[side]);if(!coeff)continue;cc.strokeStyle=side?'#17bfea':'#ffb328';cc.beginPath();for(let y=H*.52;y<H;y+=3){let yy=y/H,x=coeff[0]*yy*yy+coeff[1]*yy+coeff[2];if(y===H*.52)cc.moveTo(x,y);else cc.lineTo(x,y)}cc.stroke();valid++}
 title=['真实道路','标线候选掩膜','滑动窗口搜索','二次曲线候选'];info='本图为浏览器近似曲线搜索，找到 '+valid+'/2 条候选边界；可能误选护栏、路肩或邻道';}
for(let i=0;i<4;i++)el(['original-title','a-title','b-title','c-title'][i]).textContent=title[i];el('status').textContent=info;}
function load(){let file=el('scene').value;let im=new Image();el('status').textContent='正在读取 '+file;im.onload=()=>{img=im;calc()};im.onerror=()=>{el('status').textContent='图片无法加载：'+file};im.src='../images/'+file;}
function setup(next){exp=next;let spec=specs[exp];document.querySelectorAll('[data-exp]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.exp===exp)));el('exp-title').textContent=spec.name;el('question').textContent=spec.question;el('timing').hidden=exp!=='time';el('images').hidden=exp==='time';el('scene-picker').hidden=exp==='time';el('controls').innerHTML='';spec.params.forEach(([name,min,max,step,initial],i)=>{let label=document.createElement('label');label.innerHTML='<span>'+name+'</span><span class="value" id="value'+i+'">'+(exp==='time'?(initial/100).toFixed(2):initial)+'</span>';let range=document.createElement('input');range.type='range';range.min=min;range.max=max;range.step=step;range.value=initial;range.id='p'+i;range.oninput=()=>{el('value'+i).textContent=exp==='time'?(Number(range.value)/100).toFixed(2):range.value;calc()};label.append(range);el('controls').append(label)});if(exp==='time'){el('status').textContent='选择视频，观察真实逐帧检测及位置波动；参数仅更新下方二次平滑曲线';loadDiagnostics()}else{el('scene').value=spec.scene;load()}}
document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>setup(b.dataset.exp));el('scene').onchange=load;
document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>{clip=b.dataset.clip;document.querySelectorAll('[data-clip]').forEach(x=>x.classList.toggle('active',x===b));let v=el('video');v.pause();v.src='../downloads/E03_'+clip+'_compare.mp4';v.load();renderChart()});
async function loadDiagnostics(){if(series){renderChart();return}try{let r=await fetch('../downloads/E03_diagnostics.json');if(!r.ok)throw Error('HTTP '+r.status);series=await r.json();renderChart()}catch(err){el('video-note').textContent='轨迹数据读取失败：'+err.message}}
function renderChart(){if(!series)return;let data=series[clip];if(!data?.length)return;let alpha=value(0)/100,raw=data.map(x=>x.x),smoothed=[],last=null;for(let x of raw){if(x===null){smoothed.push(last);continue}last=last===null?x:alpha*x+(1-alpha)*last;smoothed.push(last)}let c=el('chart'),cx=c.getContext('2d');cx.clearRect(0,0,c.width,c.height);cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);let clean=raw.filter(x=>x!==null);if(clean.length<2){el('video-note').textContent='无足够连续轨迹';return}let yMin=Math.min(...clean)-20,yMax=Math.max(...clean)+20,xAt=i=>30+i/(raw.length-1)*(c.width-47),yAt=v=>c.height-22-(v-yMin)/(yMax-yMin)*(c.height-40);cx.strokeStyle='#dce2ed';for(let i=0;i<4;i++){let y=12+i*(c.height-34)/3;cx.beginPath();cx.moveTo(30,y);cx.lineTo(c.width-12,y);cx.stroke()};for(let [values,color] of [[raw,'#9bb0c6'],[smoothed,'#4167d9']]){cx.strokeStyle=color;cx.lineWidth=2;cx.beginPath();values.forEach((v,i)=>{if(v===null)return;if(i===0)cx.moveTo(xAt(i),yAt(v));else cx.lineTo(xAt(i),yAt(v))});cx.stroke()}let valid=data.filter(x=>x.valid).length;el('video-note').textContent='真实视频总帧数 '+data.length+'；内部拟合有效 '+valid+' 帧；展示 α='+alpha.toFixed(2)+' 的记录轨迹二次平滑；不是检测准确率';}
el('chart').onclick=e=>{if(!series)return;let rect=el('chart').getBoundingClientRect();let x=(e.clientX-rect.left)/rect.width,idx=Math.max(0,Math.min(series[clip].length-1,Math.round((x-.033)*series[clip].length)));let v=el('video');v.currentTime=series[clip][idx].time};
setup('warp');
</script></body></html>
