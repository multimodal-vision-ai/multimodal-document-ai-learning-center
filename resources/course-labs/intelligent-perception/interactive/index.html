<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>道路视觉探索实验 · MVAI Learning Center</title>
<style>
:root{--main:#536eff;--ink:#1c304b;--sub:#637b92;--line:#dfe7f0;--background:#f6f8fb}
*{box-sizing:border-box}body{margin:0;background:var(--background);font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}
header{background:white;border-bottom:1px solid var(--line);padding:17px 3vw;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header a{color:#435fcf;text-decoration:none;font-weight:700;font-size:13px}
h1{margin:0;font-size:19px}h2{font-size:18px;margin:0 0 14px}
main{max-width:1450px;margin:auto;padding:24px 20px 70px}
.toolbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.tabs{display:flex;gap:8px}.tab,.btn{font-family:inherit;border:1px solid #cfdcec;background:#fff;color:#36577e;border-radius:9px;font-size:13px;cursor:pointer;padding:10px 15px;font-weight:700}
.tab.active,.btn.primary{background:var(--main);border-color:var(--main);color:#fff}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px}
aside,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:20px}
aside{position:sticky;top:18px;align-self:start;max-height:calc(100vh - 30px);overflow-y:auto}
label{display:block;font-size:12px;font-weight:750;color:#425d76;margin:16px 0 6px}
select{width:100%;border-radius:8px;border:1px solid #ccd9e7;padding:10px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
.control{margin:14px 0}.control label{display:flex;justify-content:space-between;margin-bottom:4px}.control output{color:#3c61cc;font-weight:800}
input[type=range]{width:100%;accent-color:var(--main)}.help{font-size:12px;color:var(--sub);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.figure{margin:0;border:1px solid #e2e8ee;border-radius:10px;overflow:hidden;background:#eef2f7}.figure canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain}.figure figcaption{padding:10px 12px;background:white;font-size:12px;font-weight:700;color:#415d77}
.note{background:#f0f5ff;border-left:3px solid var(--main);border-radius:7px;padding:13px 16px;margin:20px 0;color:#355576;font-size:13px;line-height:1.8}
.muted{color:var(--sub);font-size:12px}.video{width:100%;max-width:780px;display:block;border-radius:9px}
#generalization{margin-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#generalization figure{margin:0}#generalization img{width:100%;display:block;border:1px solid var(--line);border-radius:7px}
#generalization figcaption{font-size:10px;color:var(--sub);padding:5px}
footer{font-size:11px;color:#788ca0;text-align:center;margin-top:40px}
@media(max-width:920px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none}}
@media(max-width:600px){.grid{grid-template-columns:1fr}#generalization{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:12px}}

const W=640,H=360;

function showRGBA(id,rgb){const out=new Uint8ClampedArray(W*H*4);for(let i=0;i<W*H;i++){out[i*4]=rgb[i*3];out[i*4+1]=rgb[i*3+1];out[i*4+2]=rgb[i*3+2];out[i*4+3]=255}cv(id,out)}
const gray=a=>{const o=new Float32Array(W*H);for(let i=0;i<o.length;i++)o[i]=.299*a[4*i]+.587*a[4*i+1]+.114*a[4*i+2];return o};
const clamp=x=>Math.max(0,Math.min(255,Math.round(x)));
function blur(a,r=1){const b=new Float32Array(a.length),size=2*r+1;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let z=0,n=0;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){let xx=x+dx,yy=y+dy;if(xx>=0&&xx<W&&yy>=0&&yy<H){z+=a[yy*W+xx];n++}}b[y*W+x]=z/n}return b}
function threshold(a,t){const b=new Uint8Array(a.length);for(let i=0;i<a.length;i++)b[i]=a[i]>=t?255:0;return b}
function otsu(a){const hist=new Int32Array(256);for(let v of a)hist[clamp(v)]++;let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];let w0=0,s0=0,best=-1,t=127;for(let i=0;i<256;i++){w0+=hist[i];if(!w0)continue;const w1=a.length-w0;if(!w1)break;s0+=i*hist[i];const v=(sum-s0)/w1-s0/w0;const score=w0*w1*v*v;if(score>best){best=score;t=i}}return t}
function adaptive(a,r,C){const out=new Uint8Array(a.length);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let total=0,n=0;for(let yy=Math.max(0,y-r);yy<=Math.min(H-1,y+r);yy++)for(let xx=Math.max(0,x-r);xx<=Math.min(W-1,x+r);xx++){total+=a[yy*W+xx];n++}out[y*W+x]=a[y*W+x]>=total/n-C?255:0}return out}
function kernelFilter(a,r,kind,sigma=60){const out=new Float32Array(a.length);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let vals=[],sum=0,weights=0;const center=a[y*W+x];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const yy=y+dy,xx=x+dx;if(yy<0||xx<0||yy>=H||xx>=W)continue;const v=a[yy*W+xx];if(kind==="median"){vals.push(v);continue}let w=kind==="bilateral"?Math.exp(-((v-center)*(v-center))/(2*sigma*sigma)):Math.exp(-(dx*dx+dy*dy)/(2*Math.max(1,r*r)));sum+=v*w;weights+=w}const i=y*W+x;if(kind==="median"){vals.sort((p,q)=>p-q);out[i]=vals[Math.floor(vals.length/2)]}else out[i]=sum/Math.max(.0001,weights)}return out}
function hsvMask(p,hMin,hMax,vWhite=175,withWhite=true){const out=new Uint8Array(W*H);for(let i=0;i<out.length;i++){let R=p[i*4]/255,G=p[i*4+1]/255,B=p[i*4+2]/255,hi=Math.max(R,G,B),lo=Math.min(R,G,B),d=hi-lo,h=0;if(d){if(hi===R)h=((G-B)/d)%6;else if(hi===G)h=(B-R)/d+2;else h=(R-G)/d+4;h=(h*30+180)%180}let s=hi===0?0:(d/hi)*255,v=hi*255;out[i]=(h>=hMin&&h<=hMax&&s>=70&&v>=70)||(withWhite&&s<=85&&v>=vWhite)?255:0}return out}
function morph(a,r,dilate){const out=new Uint8Array(a.length);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let val=dilate?0:255;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){let yy=y+dy,xx=x+dx;if(yy<0||xx<0||yy>=H||xx>=W)continue;let u=a[yy*W+xx];val=dilate?Math.max(val,u):Math.min(val,u)}out[y*W+x]=val}return out}
function insideROI(x,y,top=.55){let y0=top*H,y1=.97*H;if(y<y0||y>y1)return false;let t=(y-y0)/(y1-y0);return x>=W*(.42-.37*t)&&x<=W*(.58+.40*t)}
function drawROI(data,top){const o=data.slice();for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!insideROI(x,y,top)){let i=(y*W+x)*4;o[i]=o[i]*.25;o[i+1]=o[i+1]*.25;o[i+2]=o[i+2]*.25}return o}
function canny(g,low=50,high=150){const img=blur(g,1),mag=new Float32Array(g.length),angle=new Uint8Array(g.length);
for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let i=y*W+x;
let gx=-img[i-W-1]+img[i-W+1]-2*img[i-1]+2*img[i+1]-img[i+W-1]+img[i+W+1];
let gy=-img[i-W-1]-2*img[i-W]-img[i-W+1]+img[i+W-1]+2*img[i+W]+img[i+W+1];
mag[i]=Math.min(255,Math.hypot(gx,gy)/4);
let a=(Math.atan2(gy,gx)*180/Math.PI+180)%180;
angle[i]=a<22.5||a>=157.5?0:a<67.5?1:a<112.5?2:3}
const edge=new Uint8Array(g.length),weak=new Uint8Array(g.length),queue=[];
for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x,m=mag[i],d=angle[i],offset=d===0?1:d===1?W+1:d===2?W:W-1;if(m<mag[i-offset]||m<mag[i+offset])continue;if(m>=high){edge[i]=255;queue.push(i)}else if(m>=low)weak[i]=1}
for(let n=0;n<queue.length;n++){const i=queue[n];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const j=i+dy*W+dx;if(j<0||j>=edge.length||!weak[j])continue;weak[j]=0;edge[j]=255;queue.push(j)}}return edge}
function maskROI(edges,top){const out=new Uint8Array(edges.length);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x;if(insideROI(x,y,top))out[i]=edges[i]}return out}
function houghLines(roi,voteLimit=30){const diag=Math.ceil(Math.hypot(W,H)),rhoSteps=2*diag+1,angles=[];for(let deg=12;deg<170;deg+=3)angles.push([Math.cos(deg*Math.PI/180),Math.sin(deg*Math.PI/180),deg]);
const votes=new Int32Array(rhoSteps*angles.length);
for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2)if(roi[y*W+x])for(let t=0;t<angles.length;t++){let rho=Math.round(x*angles[t][0]+y*angles[t][1])+diag;votes[t*rhoSteps+rho]++}
let peaks=[];for(let t=0;t<angles.length;t++)for(let r=0;r<rhoSteps;r++){let v=votes[t*rhoSteps+r];if(v>=voteLimit)peaks.push({v,t,r})}
peaks.sort((a,b)=>b.v-a.v);let lines=[];
for(let p of peaks){if(lines.length>=28)break;if(lines.some(z=>Math.abs(z.t-p.t)<=2&&Math.abs(z.r-p.r)<=16))continue;
let [c,s]=angles[p.t];if(Math.abs(c)<.17)continue;
let y1=.55*H,y2=.97*H,x1=(p.r-diag-y1*s)/c,x2=(p.r-diag-y2*s)/c;
if((x1<-.5*W&&x2<-.5*W)||(x1>1.5*W&&x2>1.5*W))continue;
lines.push({...p,x1,y1,x2,y2})}
return lines}
function overlayLines(data,lines,kind="all"){const out=data.slice();const c=document.createElement("canvas");c.width=W;c.height=H;let ctx=c.getContext("2d");ctx.putImageData(new ImageData(out,W,H),0,0);ctx.lineWidth=3;
for(let l of lines){let dxdy=(l.x2-l.x1)/(l.y2-l.y1),xb=l.x2;let left=dxdy<-.15&&xb<W*.5,right=dxdy>.15&&xb>W*.5;if(kind==="fit"&&!left&&!right)continue;ctx.strokeStyle=kind==="fit"?(left?"#ff6236":"#2bbff0"):"#2fed63";ctx.lineWidth=kind==="fit"?6:2;ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke()}return ctx.getImageData(0,0,W,H).data}
function solve(a,b){let n=8;for(let i=0;i<n;i++){let best=i;for(let j=i+1;j<n;j++)if(Math.abs(a[j][i])>Math.abs(a[best][i]))best=j;[a[i],a[best]]=[a[best],a[i]];[b[i],b[best]]=[b[best],b[i]];let m=a[i][i];if(Math.abs(m)<1e-9)return null;for(let k=i;k<n;k++)a[i][k]/=m;b[i]/=m;for(let j=0;j<n;j++)if(j!==i){let z=a[j][i];for(let k=i;k<n;k++)a[j][k]-=z*a[i][k];b[j]-=z*b[i]}}return b}
function homography(src,dst){const a=[],b=[];for(let i=0;i<4;i++){let [x,y]=src[i],[u,v]=dst[i];a.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);a.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}return solve(a,b)}
function perspective(img,top,topWidth,bottomWidth){const a=topWidth/200,b=bottomWidth/200;
const src=[[W*(.5-a),H*top/100],[W*(.5+a),H*top/100],[W*(.5+b),.97*H],[W*(.5-b),.97*H]];
const dst=[[.25*W,0],[.75*W,0],[.75*W,H-1],[.25*W,H-1]];
const overlay=img.slice();let c=document.createElement("canvas");c.width=W;c.height=H;let ctx=c.getContext("2d");ctx.putImageData(new ImageData(overlay,W,H),0,0);ctx.strokeStyle="#ff5d37";ctx.lineWidth=4;ctx.beginPath();src.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.stroke();
let Hinv=homography(dst,src);let warped=new Uint8ClampedArray(img.length);for(let i=0;i<W*H;i++)warped[4*i+3]=255;
if(Hinv)for(let y=0;y<H;y++)for(let x=0;x<W;x++){let d=Hinv[6]*x+Hinv[7]*y+1,sx=(Hinv[0]*x+Hinv[1]*y+Hinv[2])/d,sy=(Hinv[3]*x+Hinv[4]*y+Hinv[5])/d,xx=Math.round(sx),yy=Math.round(sy);if(xx>=0&&yy>=0&&xx<W&&yy<H){let z=(y*W+x)*4,p=(yy*W+xx)*4;warped[z]=img[p];warped[z+1]=img[p+1];warped[z+2]=img[p+2]}}
return [ctx.getImageData(0,0,W,H).data,warped]}
const rgbToImage=(image)=>{const c=document.createElement("canvas");c.width=W;c.height=H;const ctx=c.getContext("2d");ctx.drawImage(image,0,0,W,H);return ctx.getImageData(0,0,W,H).data};
function setTitles(...titles){titles.forEach((t,i)=>byId("title"+i).textContent=t)}
let latestValues=[];
function calc(data,kind,v){
 const g=gray(data),rgba=data.slice();cv("original",data);
 if(lab==="e01"){
 if(kind==="color"){let m=hsvMask(data,v[0],v[1],v[2]);cv("stage1",m,true);cv("stage2",hsvMask(data,v[0],v[1],v[2],false),true);cv("stage3",hsvMask(data,999,999,v[2]),true);setTitles("原图","黄白组合掩膜","仅黄色掩膜","仅白色掩膜");return "白色掩膜可能包含天空和反光，请区分颜色候选与车道线真实位置"}
 if(kind==="threshold"){let t=otsu(g);cv("stage1",threshold(g,v[0]),true);cv("stage2",threshold(g,t),true);cv("stage3",adaptive(g,v[1],v[2]),true);setTitles("原图","全局阈值 = "+v[0],"Otsu 阈值 = "+t,"自适应阈值");return "Otsu 自动阈值 "+t+"；局部阈值可能放大树影和纹理"}
 if(kind==="filter"){cv("stage1",kernelFilter(g,v[0],"mean"),true);cv("stage2",kernelFilter(g,v[0],"median"),true);cv("stage3",kernelFilter(g,v[0],"bilateral",v[1]),true);setTitles("原图","加权均值平滑","中值滤波","双边滤波");return "对照边缘清晰度，而不是仅看图像是否更平滑"}
 if(kind==="morph"){const m=hsvMask(data,v[1],v[2],245,false),er=morph(m,v[0],false),di=morph(m,v[0],true),closing=morph(er,v[0],true);cv("stage1",m,true);cv("stage2",di,true);cv("stage3",closing,true);setTitles("原图","黄线颜色掩膜","膨胀","腐蚀后膨胀（开运算）");return "增大核会删除小前景，也可能损害车道线的连续性"}
 if(kind==="perspective"){let [src,warp]=perspective(data,v[0],v[1],v[2]);cv("stage1",src);cv("stage2",warp);cv("stage3",warp);setTitles("原图","四点透视源区域","近似鸟瞰图","近似鸟瞰图（对照）");return "这里只是图像透视校正，不对应真实世界的米制尺度"}
 }else{
 let top=kind==="roi"?.01*v[0]:kind==="fit"||kind==="generalization"?.01*v[1]:.55,low=kind==="canny"?v[0]:kind==="roi"?v[1]:kind==="hough"?v[1]:50,high=kind==="canny"?v[1]:kind==="roi"?v[2]:kind==="hough"?v[2]:150;
 const e=canny(g,low,high),masked=maskROI(e,top),votes=(kind==="hough"||kind==="fit"||kind==="generalization")?v[0]:30,lines=houghLines(masked,votes);
 if(kind==="canny"){cv("stage1",canny(g,30,90),true);cv("stage2",e,true);cv("stage3",canny(g,100,200),true);setTitles("原图","Canny 30 / 90","当前阈值结果","Canny 100 / 200");return "当前阈值边缘像素 "+e.reduce((x,y)=>x+(y>0),0)+"，包含所有强边缘"}
 if(kind==="roi"){cv("stage1",e,true);cv("stage2",drawROI(rgba,top));cv("stage3",masked,true);setTitles("原图","Canny 边缘","ROI 梯形区域","ROI 内边缘");return "ROI 顶边="+Math.round(top*100)+"%；请换成弯道观察局限"}
 cv("stage1",masked,true);cv("stage2",overlayLines(rgba,lines));cv("stage3",overlayLines(rgba,lines,"fit"));
 setTitles("原图","Canny + ROI","Hough 候选直线","左右几何候选");
 return "Hough 候选直线 "+lines.length+" 条（浏览器教学实现，并非 OpenCV HoughLinesP 原样输出；非准确率）";
 }
 return "";
}
function load(){let idx=Number(byId("scene").value),filename=FILES[idx][0];byId("metrics").textContent="正在加载真实道路图片："+filename;let im=new Image();im.onload=()=>{image=rgbToImage(im);schedule()};im.onerror=()=>{byId("metrics").textContent="图片加载失败："+filename+"。请刷新页面，或检查资源文件。";console.error("Cannot load road image:",filename,im.src)};im.src=(window.MVAI_INLINE_IMAGES&&window.MVAI_INLINE_IMAGES[filename])||"../images/"+filename}
function spec(){return SPEC[lab].find(x=>x.id===exp)||SPEC[lab][0]}
function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(!image)return;try{latestValues=[...byId("params").querySelectorAll("input")].map(x=>Number(x.value));byId("metrics").textContent=calc(image,exp,latestValues)}catch(e){byId("metrics").textContent="实验计算失败："+e.message;console.error(e)}})}
function configure(defaultScene=true){
let s=spec();byId("prompt").textContent=s.prompt;byId("lessonTitle").textContent=lab==="e01"?"E01 · 道路图像处理":"E02 · 车道线检测";
byId("params").replaceChildren();s.p.forEach((p,i)=>{const d=document.createElement("div");d.className="control";
const l=document.createElement("label");l.textContent=p[0];const o=document.createElement("output");o.textContent=p[4];l.append(o);
const inp=document.createElement("input");inp.type="range";inp.min=p[1];inp.max=p[2];inp.step=p[3];inp.value=p[4];inp.addEventListener("input",()=>{o.textContent=inp.value;schedule()});
d.append(l,inp);byId("params").append(d)});
byId("more").hidden=exp!=="generalization";
if(defaultScene)byId("scene").value=String(s.scene);
load();
}
function setupLab(next,selected){
lab=next;byId("tab-e01").classList.toggle("active",lab==="e01");byId("tab-e02").classList.toggle("active",lab==="e02");
const sel=byId("experiment");sel.replaceChildren();SPEC[lab].forEach(s=>{const o=document.createElement("option");o.value=s.id;o.textContent=s.name;sel.appendChild(o)});
exp=SPEC[lab].some(x=>x.id===selected)?selected:SPEC[lab][0].id;sel.value=exp;configure()}
FILES.forEach(([name,title],i)=>{const o=document.createElement("option");o.value=i;o.textContent=String(i+1).padStart(2,"0")+" · "+title;byId("scene").append(o)});
byId("scene").addEventListener("change",load);
byId("experiment").addEventListener("change",()=>{exp=byId("experiment").value;configure()});
byId("tab-e01").onclick=()=>setupLab("e01");
byId("tab-e02").onclick=()=>setupLab("e02");
byId("reset").onclick=()=>configure(false);
byId("full").onclick=()=>{const p=document.querySelector(".panel");p.requestFullscreen?.()};
byId("save").onclick=()=>{const c=document.createElement("canvas");c.width=2*W;c.height=2*H;let ctx=c.getContext("2d");["original","stage1","stage2","stage3"].forEach((id,i)=>ctx.drawImage(byId(id),(i%2)*W,Math.floor(i/2)*H));let a=document.createElement("a");a.download=lab+"-"+exp+".png";a.href=c.toDataURL("image/png");a.click()};
byId("runNine").onclick=async()=>{
 const grid=byId("generalization");grid.replaceChildren();const button=byId("runNine");button.disabled=true;
 for(let i=0;i<FILES.length;i++){
  const im=new Image();im.src="../images/"+FILES[i][0];
  await new Promise(resolve=>{im.onload=resolve;im.onerror=resolve});
  if(!im.naturalWidth)continue;
  let raw=rgbToImage(im),g=gray(raw),top=(latestValues[1]||55)/100,votes=latestValues[0]||30;
  let edges=maskROI(canny(g,50,150),top),lines=houghLines(edges,votes),out=overlayLines(raw,lines,"fit");
  const c=document.createElement("canvas");c.width=W;c.height=H;c.getContext("2d").putImageData(new ImageData(out,W,H),0,0);
  let f=document.createElement("figure"),pic=document.createElement("img");pic.src=c.toDataURL("image/jpeg",.8);
  let cap=document.createElement("figcaption");cap.textContent=FILES[i][1]+" · "+lines.length+" 条候选";
  f.append(pic,cap);grid.append(f);
 }
 button.disabled=false;
};
setupLab(lab,q.get("exp"));
</script></body></html>
