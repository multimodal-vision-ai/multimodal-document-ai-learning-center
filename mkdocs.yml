site_name: 多模态视觉智能学习中心
site_description: Multimodal Vision AI Learning Center — 从文档理解出发，探索图像、视频与多模态智能
site_author: 谭国平教授团队 · Multimodal Vision AI Lab
site_url: https://multimodal-vision-ai.github.io/multimodal-document-ai-learning-center/

repo_name: multimodal-vision-ai/multimodal-document-ai-learning-center
repo_url: https://github.com/multimodal-vision-ai/multimodal-document-ai-learning-center
edit_uri: edit/dev/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - js/visitor.js

nav:
  - 学习首页:
      - 欢迎: index.md
      - 关于学习中心: about.md
  - 入门课程:
      - 课程首页: learning/README.md
      - 12 周自主路线: learning/00_12_Week_Bootcamp.md
      - 基础工具:
          - Git 与 GitHub: learning/01_Git_and_GitHub.md
          - Python 与可复现环境: learning/02_Python_Environment.md
          - Hugging Face Hub: learning/03_HuggingFace.md
          - Kaggle Notebook: learning/04_Kaggle.md
          - Transformers 推理: learning/05_Transformers.md
          - AI 辅助编程与验证: learning/05-1_AI_Assisted_Coding.md
      - 文档智能专题:
          - Qwen3.5-0.8B: learning/06-1_Qwen3.5-VL-0.8B.md
          - Docling 文档解析: learning/06-2_Docling.md
          - Document AI 与评测: learning/07_Doc_AI.md
      - 后训练与实验追踪:
          - LoRA、评测与 W&B: learning/08_Post_Training.md
      - 自主学习支持:
          - 自主评估与证据: learning/10_Assessment_and_Submission.md
          - 自主学习记录: learning/11_Learning_Log_Template.md
          - 常见问题: learning/09_FAQ.md
  - 动手教程:
      - 选择一个教程: tutorials/README.md
      - 文档评测：OmniDocBench Markdown: tutorials/Qwen2.5-OmniDocBench-kaggle-tutorial.md
      - 后训练路线：Qwen3.5-VL SFT/GRPO: tutorials/Qwen3.5-VL-SFT-GRPO-tutorial.md
  - 项目实战:
      - 选择一个项目: experiments/README.md
      - 项目 01：文档理解评测:
          - 项目控制台: experiments/Experiment_01/README.md
          - Part 01：确定目标与准备: experiments/Experiment_01/Part01-实验准备.md
          - Part 02：创建 GitHub 项目: experiments/Experiment_01/Part02-创建Github科研项目仓库.md
          - Part 03：构建项目目录: experiments/Experiment_01/Part03-构建项目目录.md
          - Part 04：准备实验数据: experiments/Experiment_01/Part04-数据集准备.md
          - Part 05：完成首次推理: experiments/Experiment_01/Part05-模型准备与推理.md
          - Part 06：完成受控对比: experiments/Experiment_01/Part06-提示词管理与对比分析.md
          - Part 07：评测与项目总结: experiments/Experiment_01/Part07-Bechmark评测与总结.md
  - 论文导读:
      - 先读这里: reading/README.md
      - 综述地图: reading/00_surveys.md
      - 基础模型: reading/01_foundation.md
      - 文档智能: reading/02_document-ai.md
      - 视觉语言模型: reading/03_vlm.md
      - DocTags: reading/04_doctags.md
      - 评测基准: reading/05_benchmark-2026.md
  - 学习资源:
      - 按问题找资源: resources/README.md
      - 官方文档与平台: resources/official-sources.md
      - 推荐课程: resources/courses.md
      - 论文索引: resources/papers.md
      - 数据集索引: resources/datasets.md
      - 工具清单: resources/tools.md
  - 成果展厅: projects/README.md

